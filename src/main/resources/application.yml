spring:
  application:
    name: gpi-prev-batch-faturamento

  datasource:
    jdbc-url: jdbc:sqlserver://${DATABASE_HOST:192.168.0.120}:${DATABASE_PORT:1433};databaseName=${DATABASE_NAME:GPIPrev_WEB_AON};encrypt=true;trustServerCertificate=true
    username: ${DATABASE_USER:user_gpiprev}
    password: ${DATABASE_PASSWORD:sarp123$gpi}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    platform: sqlserver

    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  batch:
    initialize-schema: always
    schema: classpath:org/springframework/batch/core/schema-sqlserver.sql

server:
  port: 8090

